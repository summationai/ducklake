#
# Builds the DuckLake branching extension for the DuckDB that GizmoSQL's edge channel embeds (.github/duckdb-version,
# a DuckDB 2.0 alpha commit). Run by hand on a tag; pushes start nothing, so the fork spends no runners.
#
name: Main Extension Distribution Pipeline
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-duckdb-version:
    name: Get DuckDB version
    runs-on: ubuntu-latest
    outputs:
      duckdb_version: ${{ steps.version.outputs.duckdb_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: version
        run: echo "duckdb_version=$(cat .github/duckdb-version)" >> $GITHUB_OUTPUT

  duckdb-next-build:
    name: Build extension binaries
    needs: get-duckdb-version
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: ${{ needs.get-duckdb-version.outputs.duckdb_version }}
      ci_tools_version: v1.5-variegata
      # Temporary override; remove when extension-ci-tools updates its default.
      vcpkg_commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
      extension_name: ducklake
      # DuckDB stamps extensions with its own version string and refuses any other. A commit checkout describes
      # as v1.5.1-17111-gb15358c371d (and this toolchain then stamps the bare hash), while GizmoSQL edge's DuckDB
      # reports v2.0.0-alpha46057: this tags the checked-out commit so the stamp matches the server.
      duckdb_tag: v2.0.0-alpha46057
      # only linux_arm64, what agc-lake's Graviton node runs; this build runs no tests, so the full suite is
      # run locally before a build is tagged
      exclude_archs: "linux_amd64;linux_amd64_musl;osx_amd64;osx_arm64;wasm_eh;wasm_mvp;wasm_threads;windows_amd64;windows_amd64_mingw;windows_arm64"
