#
# Builds the DuckLake branching extension for DuckDB v2.0.0 (.github/duckdb-version), the DuckDB that GizmoSQL v1.42.2
# embeds. Run by hand on a tag; pushes start nothing, so the fork spends no runners.
#
name: Main Extension Distribution Pipeline
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-duckdb-version:
    name: Get DuckDB version
    runs-on: ubuntu-latest
    outputs:
      duckdb_version: ${{ steps.version.outputs.duckdb_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: version
        run: echo "duckdb_version=$(cat .github/duckdb-version)" >> $GITHUB_OUTPUT

  duckdb-next-build:
    name: Build extension binaries
    needs: get-duckdb-version
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: ${{ needs.get-duckdb-version.outputs.duckdb_version }}
      ci_tools_version: v2.0-cyanoptera
      # Temporary override; remove when extension-ci-tools updates its default.
      vcpkg_commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
      extension_name: ducklake
      # The server only loads an extension stamped with its own DuckDB version (v2.0.0). This workflow passes
      # duckdb_version to the build as DUCKDB_VERSION, and the Makefile sets the same through OVERRIDE_GIT_DESCRIBE
      # for local builds.
      # only linux_arm64, what the GizmoSQL clusters run; this build runs no tests, so the full suite is run locally
      # before a build is tagged
      exclude_archs: "linux_amd64;linux_amd64_musl;osx_amd64;osx_arm64;wasm_eh;wasm_mvp;wasm_threads;windows_amd64;windows_amd64_mingw;windows_arm64"
