#
# The checks a pull request into develop must pass before it merges (spec: summationai/agent-cloud
# docs/specs/ducklake-extension-release.md, DXR-6 and DXR-7), and the coverage report that later pull requests compare
# with:
#   - tests: DuckLake's SQL logic tests (make test_release) on linux_amd64, then the PostgreSQL catalog tests, because
#     Nexus catalogs are PostgreSQL. DuckDB's tooling runs no tests on linux_arm64.
#   - coverage: the same suites plus S3 on a clang coverage build. A pull request fails when it lowers the line coverage
#     of the latest report of develop by more than 0.1 points.
# The SQLite and Quack catalog backends aren't tested here: no cluster uses them, and upstream tests them.
#
# Our own copy of upstream's Catalogs.yml and Coverage.yml, which stay unchanged and disabled (DXR-5). Runs on
# ubuntu-24.04: on ubuntu-26.04 (ubuntu-latest since late October 2026) apt-key is gone, so PostgreSQL setup fails.
# Pull requests from forks run with a read-only token and no secrets; nothing here uses pull_request_target (DXR-7).
#
name: Branching Checks
on:
  # every pull request, so a stacked one is checked before its turn to merge (DXR-3)
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # each push to develop leaves the coverage report that the next pull requests compare with
  push:
    branches:
      - develop
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.ref != 'refs/heads/develop' || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  VCPKG_TARGET_TRIPLET: x64-linux
  GEN: ninja
  VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
  ENABLE_SQLITE_SCANNER: ON
  ENABLE_POSTGRES_SCANNER: ON
  ENABLE_QUACK: ON
  BUILD_EXTENSION_TEST_DEPS: full
  DUCKDB_TPCH_ANSWERS_DIR: ${{ github.workspace }}/duckdb/extension/tpch/dbgen/answers

jobs:
  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: SQL logic and catalog tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - name: Install required ubuntu packages
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install -y -qq build-essential cmake ninja-build ccache python3 mold

    - name: Setup PostgreSQL
      uses: ikalnytskyi/action-setup-postgres@325155bfd7807b2a21ac9c2c7bb9b9a6eacc44df # v9
      with:
        postgres-version: '15'
        username: 'postgres'
        password: 'postgres'
        database: 'postgres'
        port: '5432'
        ssl: true

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
        submodules: 'true'
        persist-credentials: false

    - name: Checkout DuckDB to version
      run: |
        cd duckdb
        git checkout "$(tr -d '[:space:]' < ../.github/duckdb-version)"
        echo "testing $GITHUB_SHA against DuckDB $(git describe --tags)"

    # a pull request restores the cache but never writes it, so it can't poison the build of develop
    - name: Setup Ccache
      uses: hendrikmuhs/ccache-action@bdb258aa068f1037d00b0baa8b3e1d90127098cf # main
      with:
        key: ${{ github.job }}
        save: ${{ github.event_name == 'push' }}

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@abed23940f9d7bc267b0e1a21ee7b699a3794baa # v11.1
      with:
        vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24

    - name: Build extension
      run: |
        make release

    # Without DUCKLAKE_CI, which skips the PostgreSQL tests
    - name: Test (make test_release)
      run: |
        make test_release

    # require-env skips this test unless the variable is set before the process starts
    - name: Test DUCKLAKE_BRANCH_SYNTAX=off
      env:
        DUCKLAKE_BRANCH_SYNTAX: 'off'
      run: |
        build/release/test/unittest test/sql/branch/branch_syntax_off.test

    - name: Test Postgres
      env:
        DUCKLAKE_CI: 1
        PGSERVICE: postgres
        LOCAL_EXTENSION_REPO: ${{ github.workspace }}/build/release/repository
      run: |
        createdb ducklakedb
        build/release/test/unittest --test-config test/configs/postgres.json --test-dir ./ "test/sql/*"

  # The release pipeline's scripts (scripts/branching/release/), against stubs: no cloud access
  release-scripts:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Release script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: 'true'
        persist-credentials: false

    - name: Shellcheck
      run: |
        shellcheck scripts/branching/release/*.sh

    - name: Test sign.sh (DXR-9)
      run: |
        scripts/branching/release/test_sign.sh

    - name: Test upload.sh (DXR-11)
      run: |
        scripts/branching/release/test_upload.sh

    - name: Test promote.sh (DXR-12)
      run: |
        scripts/branching/release/test_promote.sh

    - name: Test record.sh (DXR-18)
      run: |
        scripts/branching/release/test_record.sh

  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Code coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read # to download the baseline report of develop
    env:
      CC: clang
      CXX: clang++
      # Every test run below adds its counts to the same profiles
      PROFILES: ${{ github.workspace }}/build/codecov/profiles

    steps:
    - name: Install required ubuntu packages
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install -y -qq build-essential clang llvm lcov cmake ninja-build ccache python3

    - name: Setup PostgreSQL
      uses: ikalnytskyi/action-setup-postgres@325155bfd7807b2a21ac9c2c7bb9b9a6eacc44df # v9
      with:
        postgres-version: '15'
        username: 'postgres'
        password: 'postgres'
        database: 'postgres'
        port: '5432'
        ssl: true

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
        submodules: 'true'
        persist-credentials: false

    - name: Checkout DuckDB to version
      run: |
        cd duckdb
        git checkout "$(tr -d '[:space:]' < ../.github/duckdb-version)"

    - name: Setup Ccache
      uses: hendrikmuhs/ccache-action@bdb258aa068f1037d00b0baa8b3e1d90127098cf # main
      with:
        key: ${{ github.job }}
        save: ${{ github.event_name == 'push' }}

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@abed23940f9d7bc267b0e1a21ee7b699a3794baa # v11.1
      with:
        vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24

    - name: Build extension
      run: |
        make codecov

    - name: Test DuckDB
      env:
        LLVM_PROFILE_FILE: ${{ env.PROFILES }}/ducklake-%m.profraw
      run: |
        python3 duckdb/scripts/ci/run_tests.py build/codecov/test/unittest --retry 2 "test/*"

    # require-env skips this test unless the variable is set before the process starts
    - name: Test DUCKLAKE_BRANCH_SYNTAX=off
      env:
        LLVM_PROFILE_FILE: ${{ env.PROFILES }}/ducklake-%m.profraw
        DUCKLAKE_BRANCH_SYNTAX: 'off'
      run: |
        build/codecov/test/unittest test/sql/branch/branch_syntax_off.test

    # The tests share one PostgreSQL database, so they run one at a time
    - name: Test Postgres
      env:
        LLVM_PROFILE_FILE: ${{ env.PROFILES }}/ducklake-%m.profraw
        DUCKLAKE_CI: 1
        PGSERVICE: postgres
        LOCAL_EXTENSION_REPO: ${{ github.workspace }}/build/codecov/repository
      run: |
        createdb ducklakedb
        python3 duckdb/scripts/ci/run_tests.py build/codecov/test/unittest --retry 2 --workers 1 \
          --test-config test/configs/postgres.json "test/sql/*"

    # The tests share one bucket, so they run one at a time, and without DUCKLAKE_CI
    - name: Test S3
      env:
        LLVM_PROFILE_FILE: ${{ env.PROFILES }}/ducklake-%m.profraw
        S3_TEST_SERVER_AVAILABLE: 1
      run: |
        ./scripts/start-docker.sh
        python3 duckdb/scripts/ci/run_tests.py build/codecov/test/unittest --retry 2 --workers 1 \
          --test-config test/configs/seaweedfs.json "test/sql/*"

    - name: Generate coverage report
      run: |
        python3 .github/coverage/report.py render --profiles "$PROFILES" --output build/codecov/coverage/ducklake

    - name: Upload coverage report
      id: upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-ducklake
        path: build/codecov/coverage/ducklake
        if-no-files-found: error

    - name: Test the coverage scripts
      working-directory: .github/coverage
      run: |
        python3 -m unittest -v

    # The baseline is the report of the latest coverage run on develop of this repository
    - name: Download baseline report
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        # A develop branch of a fork does not count
        LATEST: >-
          [.artifacts[] | select(.workflow_run.head_branch == "develop" and (.expired | not)
          and .workflow_run.head_repository_id == .workflow_run.repository_id)][0].archive_download_url // empty
      run: |
        url=$(gh api "repos/$REPOSITORY/actions/artifacts?name=coverage-ducklake&per_page=100" --jq "$LATEST")
        if [[ -n "$url" ]]; then
          echo "baseline: $url"
          gh api "$url" > baseline.zip
          unzip -q baseline.zip -d baseline
        else
          echo "::warning::no coverage report of develop yet; nothing to compare with"
        fi

    - name: Check coverage
      if: github.event_name == 'pull_request'
      env:
        DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
      run: |
        echo "[Coverage report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
        python3 .github/coverage/report.py check --report build/codecov/coverage/ducklake --baseline baseline \
          ${DIFF_BASE:+--diff-base "$DIFF_BASE"} --summary "$GITHUB_STEP_SUMMARY"
